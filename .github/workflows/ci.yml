name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  qualite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Lint Python
        run: ruff check .
      - name: Tests unitaires
        run: pytest -q
      - name: Validation du projet dbt (sans connexion à BigQuery)
        run: dbt parse --project-dir dbt --profiles-dir dbt
