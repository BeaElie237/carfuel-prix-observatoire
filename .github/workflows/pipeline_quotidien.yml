name: Pipeline quotidien

on:
  schedule:
    # Tous les jours à 05:17 UTC (GitHub peut retarder l'exécution de quelques minutes)
    - cron: "17 5 * * *"
  workflow_dispatch:

concurrency:
  group: pipeline-quotidien
  cancel-in-progress: false

env:
  GCP_PROJECT: ${{ vars.GCP_PROJECT }}
  BQ_LOCATION: EU
  GCS_BUCKET: ${{ vars.GCS_BUCKET }}

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Authentification GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Extraction et chargement des prix (snapshot du jour)
        run: python -m ingestion.extract_prix

      - name: Chargement du référentiel des enseignes
        run: python -m ingestion.load_enseignes

      - name: Fraîcheur des sources
        run: dbt source freshness --project-dir dbt --profiles-dir dbt

      - name: Transformations et tests dbt
        run: dbt build --project-dir dbt --profiles-dir dbt
